{% extends "base.html" %}
{% block titulo %}Entrar — {{ instancia_nome }}{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-5 col-lg-4">
    <div class="card shadow-sm mt-5">
      <div class="card-body p-4">
        <h1 class="h4 mb-4 text-center">{{ instancia_nome }}</h1>
        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="id_username">{{ form.username.label }}</label>
            <input class="form-control" type="text" name="username" id="id_username" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="id_password">{{ form.password.label }}</label>
            <input class="form-control" type="password" name="password" id="id_password" required>
          </div>
          <button class="btn w-100 text-white" style="background-color: var(--cor-primaria);" type="submit">Entrar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
