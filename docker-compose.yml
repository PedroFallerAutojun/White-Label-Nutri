# Ambiente local completo: banco + aplicação.
#
#   docker compose up --build          → sobe em http://localhost:8000
#
# O PostgreSQL é a versão 17 de propósito: o BackupNutriJR foi gerado com
# pg_dump 17 e só é restaurável por um pg_restore 17+ (ver docs/MIGRATION.md).

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nutri}
    volumes:
      - dados-postgres:/var/lib/postgresql/data
      # Backups montados apenas para leitura: o arquivo original nunca é alterado (D-002).
      - ./backups:/backups:ro
    ports:
      - "${PORTA_DB:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nutri}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # A imagem tem como padrão gunicorn + config.settings.prod (ver Dockerfile);
  # aqui sobrescrevemos para runserver + settings de desenvolvimento.
  web:
    build:
      context: .
      args:
        INSTALAR_DEV: "true"
    command:
      - python
      - manage.py
      - runserver
      - 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-nutri}
      SECRET_KEY: ${SECRET_KEY:-desenvolvimento-local-nao-usar-em-producao}
      # O runserver serve os estáticos direto; evita escrever em /app (bind mount,
      # cujo dono é o usuário do host e não o usuário do container).
      COLETAR_ESTATICOS: "false"
    volumes:
      - .:/app
    ports:
      - "${PORTA_WEB:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dados-postgres:
